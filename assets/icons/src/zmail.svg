<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>zmail (v4: light gray envelope)</title>
  <!-- zmail app icon: glowing Zorro Z on a dark envelope; zterminal palette only. -->
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#37383d"/>
      <stop offset="1" stop-color="#2a2b2f"/>
    </linearGradient>
    <linearGradient id="zfill" x1="0.1" y1="1" x2="0.9" y2="0">
      <stop offset="0" stop-color="#28502a"/>
      <stop offset="0.45" stop-color="#28502a"/>
      <stop offset="1" stop-color="#53833e"/>
    </linearGradient>
    <filter id="glowWide" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="38"/>
    </filter>
    <filter id="glowNear" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="11"/>
    </filter>
    <filter id="edge" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <path id="z" d="M 250 450
                    C 390 356 590 304 802 270
                    C 690 410 560 560 440 676
                    C 580 658 700 628 808 578
                    C 680 676 470 746 222 822
                    C 360 670 500 520 640 372
                    C 520 366 360 390 250 450 Z"/>
    <clipPath id="zClip"><use href="#z"/></clipPath>
    <clipPath id="tileClip"><rect x="68" y="72" width="888" height="888" rx="170"/></clipPath>
  </defs>

  <!-- rounded dark tile + frame (as zterminal) -->
  <rect x="68" y="72" width="888" height="888" rx="170" fill="url(#frame)"/>
  <rect x="70" y="74" width="884" height="884" rx="168" fill="none" stroke="#37383d" stroke-width="4"/>
  <rect x="104" y="108" width="816" height="816" rx="136" fill="#0a0e11"/>

  <!-- envelope: body #2a2b2f, flap #37383d, dark fold lines -->
  <rect x="166" y="318" width="692" height="460" rx="40" fill="#0a0e11" filter="url(#soft)"/>
  <rect x="166" y="300" width="692" height="460" rx="40" fill="#c8cacd"/>
  <path d="M 194 738 L 446 536 M 830 738 L 578 536" stroke="#8e9196" stroke-width="9" stroke-linecap="round" fill="none"/>
  <path d="M 172 318 Q 180 300 206 300 L 818 300 Q 844 300 852 318 L 512 574 Z" fill="#d9dbde"/>
  <path d="M 178 316 L 512 568 L 846 316" stroke="#8e9196" stroke-width="10" stroke-linejoin="round" stroke-linecap="round" fill="none"/>
  <rect x="166" y="300" width="692" height="460" rx="40" fill="none" stroke="#53833e" stroke-width="10"/>
  <!-- dim green outer rim -->
  <rect x="162" y="296" width="700" height="468" rx="44" fill="none" stroke="#28502a" stroke-width="5"/>

  <!-- glow behind the Z -->
  <g clip-path="url(#tileClip)">
    <use href="#z" fill="#003600" filter="url(#glowWide)" transform="translate(0 8)"/>
    <use href="#z" fill="#53833e" filter="url(#glowWide)" opacity="0.7"/>
    <use href="#z" fill="#82e164" filter="url(#glowNear)" opacity="0.9"/>
  </g>
  <!-- v4: strong dark outline + drop shadow so the Z pops on the light envelope -->
  <use href="#z" fill="#0a0e11" stroke="#0a0e11" stroke-width="30" stroke-linejoin="round" transform="translate(8 12)" opacity="0.55" filter="url(#edge)"/>
  <use href="#z" fill="#0a0e11" stroke="#0a0e11" stroke-width="26" stroke-linejoin="round"/>
  <!-- Z body: dark core, glowing edges -->
  <use href="#z" fill="url(#zfill)"/>
  <g clip-path="url(#zClip)">
    <use href="#z" fill="none" stroke="#82e164" stroke-width="30" filter="url(#edge)" opacity="0.9"/>
  </g>
  <use href="#z" fill="none" stroke="#82e164" stroke-width="7" stroke-linejoin="miter" stroke-miterlimit="20"/>
  <use href="#z" fill="none" stroke="#cefcb9" stroke-width="2.5" stroke-linejoin="miter" stroke-miterlimit="20"/>
  <!-- hot highlights along the blade spines -->
  <path d="M 330 404 C 470 340 640 302 784 280" stroke="#e7ffd5" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.75"/>
  <path d="M 300 790 C 500 736 680 670 790 596" stroke="#cefcb9" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.6"/>
</svg>
