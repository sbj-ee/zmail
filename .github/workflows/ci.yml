# Build, test and package zmail on Ubuntu 24.04 (Linux amd64 only).
# Version comes from CMake project() -> PROJECT_VERSION; the .deb is
# zmail_<version>_amd64.deb.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    name: Linux (ubuntu-24.04)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check bundled asset licenses (sounds, icons)
        run: ./tools/check-asset-licenses.sh

      - name: Check that actions are pinned by commit SHA
        run: ./tools/check-action-pins.sh

      - name: Install Qt 6 + build tools
        # This step has hung for 20+ minutes on the hosted runner (a stalled
        # mirror, or the man-db trigger): fail fast and retry downloads.
        timeout-minutes: 10
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update -qq
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y -qq \
            qt6-base-dev qt6-svg-dev qt6-qpa-plugins qt6-multimedia-dev qtkeychain-qt6-dev libqt6sql6-sqlite \
            libmd4c-dev libmd4c-html0-dev libzip-dev libhunspell-dev hunspell-en-us fonts-noto-color-emoji \
            libgl1-mesa-dev cmake ninja-build g++ dpkg-dev

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DZMAIL_WERROR=ON

      - name: Build
        run: cmake --build build

      - name: Test (mock Google only; no network access to Google)
        run: ctest --test-dir build --output-on-failure --timeout 180

      - name: Package .deb
        run: |
          cd build
          cpack -G DEB
          ls -l *.deb
          dpkg-deb -I zmail_*_amd64.deb
          dpkg-deb -c zmail_*_amd64.deb
          dpkg-deb -c zmail_*_amd64.deb | grep -q './usr/bin/zmail$'
          dpkg-deb -c zmail_*_amd64.deb | grep -q './usr/share/zmail/sounds/new-mail.wav$'
          dpkg-deb -c zmail_*_amd64.deb > deb-contents.txt
          for sz in 16 24 32 48 64 128 256 512; do
            grep -q "./usr/share/icons/hicolor/${sz}x${sz}/apps/zmail.png$" deb-contents.txt
          done
          dpkg-deb --fsys-tarfile zmail_*_amd64.deb | tar -xO ./usr/share/applications/zmail.desktop > zmail.desktop.out
          grep -qx 'Icon=zmail' zmail.desktop.out
          want="$(sed -nE 's/^project\(zmail VERSION ([0-9.]+).*/\1/p' ../CMakeLists.txt)"
          echo "expect Version $want"
          dpkg-deb -f zmail_*_amd64.deb Version | grep -qx "$want"
          dpkg-deb -f zmail_*_amd64.deb Depends | tee /dev/stderr | grep -q 'libqt6svg6'
          dpkg-deb -f zmail_*_amd64.deb Depends | grep -q 'libqt6sql6-sqlite'
          dpkg-deb -f zmail_*_amd64.deb Depends | grep -q 'libqt6keychain'
          dpkg-deb -f zmail_*_amd64.deb Depends | tee /dev/stderr | grep -qiE 'libqt6multimedia|qt6-multimedia'
          dpkg-deb -f zmail_*_amd64.deb Depends | grep -q 'libzip'
          dpkg-deb -f zmail_*_amd64.deb Depends | grep -q 'libmd4c-html0'
          dpkg-deb -f zmail_*_amd64.deb Recommends | grep -q 'hunspell-en-us'
          dpkg-deb -f zmail_*_amd64.deb Recommends | grep -q 'fonts-noto-color-emoji'

      - name: Upload .deb artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zmail-deb
          path: build/zmail_*_amd64.deb
          if-no-files-found: error

  # The same tests under AddressSanitizer (with leak detection) and
  # UndefinedBehaviorSanitizer: the async callbacks hold a lot of shared
  # state, and a use-after-free or a self-owning closure doesn't fail a
  # normal run. Any report fails the test that produced it.
  sanitizers:
    name: Sanitizers (ASan + UBSan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Qt 6 + build tools
        # This step has hung for 20+ minutes on the hosted runner (a stalled
        # mirror, or the man-db trigger): fail fast and retry downloads.
        timeout-minutes: 10
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update -qq
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y -qq \
            qt6-base-dev qt6-svg-dev qt6-qpa-plugins qt6-multimedia-dev qtkeychain-qt6-dev libqt6sql6-sqlite \
            libmd4c-dev libmd4c-html0-dev libzip-dev libhunspell-dev hunspell-en-us fonts-noto-color-emoji \
            libgl1-mesa-dev cmake ninja-build g++

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DZMAIL_SANITIZE=ON -DZMAIL_WERROR=ON

      - name: Build
        run: cmake --build build

      - name: Test (mock Google only; no network access to Google)
        env:
          UBSAN_OPTIONS: print_stacktrace=1
        run: ctest --test-dir build --output-on-failure --timeout 900
