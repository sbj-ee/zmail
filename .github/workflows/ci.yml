# Build, test and package zmail on Ubuntu 24.04 (Linux amd64 only).
# Version comes from CMake project() -> PROJECT_VERSION; the .deb is
# zmail_<version>_amd64.deb.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    name: Linux (ubuntu-24.04)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Check bundled asset licenses (sounds, icons)
        run: ./tools/check-asset-licenses.sh

      - name: Install Qt 6 + build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            qt6-base-dev qt6-svg-dev qt6-qpa-plugins qt6-multimedia-dev qtkeychain-qt6-dev libqt6sql6-sqlite \
            libgl1-mesa-dev cmake ninja-build g++ dpkg-dev

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Test (mock Google only; no network access to Google)
        run: ctest --test-dir build --output-on-failure --timeout 180

      - name: Package .deb
        run: |
          cd build
          cpack -G DEB
          ls -l *.deb
          dpkg-deb -I zmail_*_amd64.deb
          dpkg-deb -c zmail_*_amd64.deb
          dpkg-deb -c zmail_*_amd64.deb | grep -q './usr/bin/zmail$'
          want="$(sed -nE 's/^project\(zmail VERSION ([0-9.]+).*/\1/p' ../CMakeLists.txt)"
          echo "expect Version $want"
          dpkg-deb -f zmail_*_amd64.deb Version | grep -qx "$want"
          dpkg-deb -f zmail_*_amd64.deb Depends | tee /dev/stderr | grep -q 'libqt6svg6'
          dpkg-deb -f zmail_*_amd64.deb Depends | grep -q 'libqt6sql6-sqlite'
          dpkg-deb -f zmail_*_amd64.deb Depends | grep -q 'libqt6keychain'

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v7
        with:
          name: zmail-deb
          path: build/zmail_*_amd64.deb
          if-no-files-found: error
